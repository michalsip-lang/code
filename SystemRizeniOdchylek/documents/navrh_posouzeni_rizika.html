<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posouzení rizika</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#1d2c39;font:15px/1.45 Arial,Helvetica,sans-serif}.app{max-width:1100px;margin:28px auto;background:#fff;box-shadow:0 2px 16px #1c3e5620}header{background:#12324d;color:#fff;padding:24px 34px}h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.84}main{padding:28px 34px}.section{border:1px solid #d4e0e8;border-radius:5px;margin:18px 0;overflow:hidden}.section h2{margin:0;padding:12px 16px;background:#f4f8fb;color:#163b5a;font-size:17px;border-bottom:1px solid #d4e0e8}.content{padding:17px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.full{grid-column:1/-1}label{display:block;font-weight:bold;color:#365168;margin-bottom:5px}.required{color:#b42318}input,select,textarea{width:100%;min-height:38px;padding:8px;border:1px solid #afc0cd;border-radius:3px;font:inherit}textarea{min-height:75px;resize:vertical}.readonly{background:#f2f5f7;color:#526576}.notice{padding:12px;background:#edf7fc;border-left:4px solid #1685ba;color:#26465c}.warning{padding:12px;background:#fff3f2;border-left:4px solid #bd3d35;color:#6b2723}.check{display:flex;gap:8px;align-items:flex-start;margin:10px 0}.check input{width:auto;min-height:0;margin-top:4px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}button{border:0;border-radius:3px;padding:10px 16px;font-weight:bold;cursor:pointer}.secondary{background:#e7edf1;color:#28465c}.primary{background:#1673ac;color:#fff}.success{display:none;margin-top:14px;padding:12px;background:#eaf8ef;border-left:4px solid #2a8251;color:#1c5d38}.success.visible{display:block}@media(max-width:720px){.app{margin:0}.grid{grid-template-columns:1fr}header,main{padding-left:18px;padding-right:18px}}</style></head><body><div class="app"><header><h1>Posouzení rizika</h1><p>QA formulář navazující na evidovanou odchylku</p></header><main><form id="riskForm" novalidate>
<div class="section"><h2>1. Kontext odchylky</h2><div class="content grid"><div><label>Číslo odchylky</label><input class="readonly" value="ODCH-2026-00017" readonly></div><div><label>Zdroj</label><input class="readonly" value="Interní kontrola" readonly></div><div><label>Datum zjištění</label><input class="readonly" value="18. 9. 2026 09:20" readonly></div><div class="full"><label>Název a popis</label><textarea class="readonly" readonly>Chybí záznam o kontrole teploty ve skladu. Skladník událost nahlásil, zásoba zatím nebyla uvolněna.</textarea></div><div><label>Rozsah</label><input class="readonly" value="Produkt i proces" readonly></div><div><label>Produkt / šarže</label><input class="readonly" value="Léčivo / šarže A12345" readonly></div><div><label>Lokalita</label><input class="readonly" value="Centrální sklad" readonly></div></div></div>
<div class="section"><h2>2. Odborné hodnocení QA</h2><div class="content grid"><div><label>Posuzující <span class="required">*</span></label><input id="assessor" required placeholder="Jméno / QA role"></div><div><label>Datum posouzení <span class="required">*</span></label><input id="date" type="datetime-local" required></div><div><label>Produktový režim <span class="required">*</span></label><select id="regime" required><option value="">Vyberte</option><option>Léčiva — GDP</option><option>Léčiva — GMP</option><option>Krmiva</option><option>Chovatelské potřeby</option></select></div><div class="full"><label>Dopad na jakost, bezpečnost a shodu <span class="required">*</span></label><textarea id="impact" required placeholder="Popište skutečný nebo potenciální dopad na produkt, pacienta/zvíře, zákazníka a regulatorní shodu."></textarea></div><div><label>Závažnost <span class="required">*</span></label><select id="severity" required><option value="">1–5</option><option>1 — zanedbatelná</option><option>2 — nízká</option><option>3 — střední</option><option>4 — vysoká</option><option>5 — kritická</option></select></div><div><label>Pravděpodobnost <span class="required">*</span></label><select id="probability" required><option value="">1–5</option><option>1 — velmi vzácná</option><option>2 — vzácná</option><option>3 — možná</option><option>4 — pravděpodobná</option><option>5 — častá</option></select></div><div><label>Odhalitelnost <span class="required">*</span></label><select id="detectability" required><option value="">1–5</option><option>1 — téměř jistá</option><option>2 — vysoká</option><option>3 — střední</option><option>4 — nízká</option><option>5 — prakticky nemožná</option></select></div></div></div>
<div class="section"><h2>3. Rozhodnutí o produktu a rozsahu</h2><div class="content grid"><div><label>Rozhodnutí o zásobě <span class="required">*</span></label><select id="stock" required><option value="">Vyberte</option><option>Blokovat / karanténa</option><option>Uvolnit</option><option>Stažení z distribuce</option><option>Produkt není dotčen</option></select></div><div><label>Rozsah dotčení <span class="required">*</span></label><select id="extent" required><option value="">Vyberte</option><option>Jedna šarže / lokalita</option><option>Více šarží</option><option>Více lokalit</option><option>Distribuční síť / zákazníci</option></select></div><div><label>Nutnost oznámení <span class="required">*</span></label><select id="notice" required><option value="">Vyberte</option><option>Ne</option><option>QA / management</option><option>Kontrolní orgán</option><option>Zákazníci / odběratelé</option></select></div><div class="full"><label>Zdůvodnění rozhodnutí <span class="required">*</span></label><textarea id="rationale" required placeholder="Uveďte, proč je zásoba blokována/uvolněna a jak byl vymezen rozsah dotčení."></textarea></div></div></div>
<div class="section"><h2>4. Vazba na FMEA a další krok</h2><div class="content grid"><div><label>Související FMEA položka</label><select id="fmea"><option value="">FMEA nenalezena — zdůvodnit</option><option>FMEA-001 — Teplotní režim skladu</option><option>FMEA-002 — Označení vyčleněné zásoby</option></select></div><div><label>Výsledné riziko</label><input class="readonly" value="Vypočte se po zadání S/P/O" readonly></div><div><label>Další workflow krok <span class="required">*</span></label><select id="next" required><option value="">Vyberte</option><option>Vyšetřování</option><option>Okamžitá CAPA</option><option>Stažení / krizový postup</option><option>Uzavřít jako nevýznamné</option></select></div><div class="full"><label>Odůvodnění vazby na FMEA / dalšího kroku <span class="required">*</span></label><textarea id="nextReason" required></textarea></div></div></div>
<div class="check"><input id="confirm" type="checkbox" required><label for="confirm" style="font-weight:normal">Potvrzuji, že posouzení rizika je založené na dostupných důkazech a že jsou uvedena všechna nutná okamžitá opatření.</label></div><div class="actions"><button class="secondary" type="reset">Vyčistit</button><button class="primary" type="submit">Uložit posouzení a předat workflow</button></div><div id="success" class="success" role="status">Návrh: posouzení by se uložilo, vytvořil by se snímek FMEA a WFE Sapiens by otevřel zvolený další krok.</div></form></main></div><script>(function(){var f=document.getElementById('riskForm'),s=document.getElementById('success');f.onsubmit=function(e){e.preventDefault();if(!f.checkValidity()){f.reportValidity();return}s.className='success visible'}}())</script></body></html>
